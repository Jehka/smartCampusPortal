<!DOCTYPE html>
<html>
<head>
    <title>Update Request Status</title>
    <style>
        body  { font-family: Arial, sans-serif; margin: 40px; background: #f0f4f8; }
        h2    { color: #2c3e50; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input, select { padding: 6px; width: 280px; margin-top: 4px;
                        border-radius: 4px; border: 1px solid #aaa; }
        button { margin-top: 16px; padding: 8px 20px; background: #e67e22;
                 color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #ca6f1e; }
        a { color: #2980b9; }
    </style>
</head>
<body>
    <h2>Update Request Status</h2>
    <form action="UpdateStatusServlet" method="post">
        <label>Request ID:</label>
        <input type="number" name="request_id" required>

        <label>New Status:</label>
        <select name="new_status" required>
            <option value="">-- Select Status --</option>
            <option value="Pending">Pending</option>
            <option value="Approved">Approved</option>
            <option value="Rejected">Rejected</option>
            <option value="Processing">Processing</option>
            <option value="Completed">Completed</option>
        </select>

        <button type="submit">Update Status</button>
    </form>
    <br><a href="index.html">Back to Home</a>
</body>
</html>
