<!DOCTYPE html>
<html>
<head>
    <title>Submit Service Request</title>
    <style>
        body  { font-family: Arial, sans-serif; margin: 40px; background: #f0f4f8; }
        h2    { color: #2c3e50; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input, select, textarea { padding: 6px; width: 280px; margin-top: 4px;
                                   border-radius: 4px; border: 1px solid #aaa; }
        textarea { height: 80px; resize: vertical; }
        button { margin-top: 16px; padding: 8px 20px; background: #2980b9;
                 color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #1a6399; }
        a { color: #2980b9; }
    </style>
</head>
<body>
    <h2>Submit Service Request</h2>
    <form action="ServiceRequestServlet" method="post">
        <label>Request ID:</label>
        <input type="number" name="request_id" required>

        <label>User ID:</label>
        <input type="number" name="user_id" required>

        <label>Service Name:</label>
        <select name="service_name" required>
            <option value="">-- Select Service --</option>
            <option value="Transport">Transport</option>
            <option value="Library">Library</option>
            <option value="Lab">Lab</option>
            <option value="Complaint Desk">Complaint Desk</option>
            <option value="Hostel">Hostel</option>
            <option value="IT Support">IT Support</option>
        </select>

        <label>Request Details:</label>
        <textarea name="request_details" required></textarea>

        <label>Status:</label>
        <select name="status" required>
            <option value="Pending">Pending</option>
            <option value="Approved">Approved</option>
            <option value="Rejected">Rejected</option>
            <option value="Processing">Processing</option>
            <option value="Completed">Completed</option>
        </select>

        <button type="submit">Submit Request</button>
    </form>
    <br><a href="index.html">Back to Home</a>
</body>
</html>
