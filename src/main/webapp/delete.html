<!DOCTYPE html>
<html>
<head>
    <title>Delete Request</title>
    <style>
        body  { font-family: Arial, sans-serif; margin: 40px; background: #f0f4f8; }
        h2    { color: #2c3e50; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input { padding: 6px; width: 280px; margin-top: 4px;
                border-radius: 4px; border: 1px solid #aaa; }
        button { margin-top: 16px; padding: 8px 20px; background: #e74c3c;
                 color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #c0392b; }
        a { color: #2980b9; }
    </style>
</head>
<body>
    <h2>Delete Service Request</h2>
    <form action="DeleteRequestServlet" method="post">
        <label>Request ID to Delete:</label>
        <input type="number" name="request_id" required>

        <button type="submit">Delete Request</button>
    </form>
    <br><a href="index.html">Back to Home</a>
</body>
</html>
